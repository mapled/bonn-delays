name: Keepalive

# Verhindert die GitHub-Deaktivierung geplanter Workflows nach ~60 Tagen ohne
# Commit auf den Default-Branch: committet monatlich einen Zeitstempel ins
# README auf main. Haelt damit auch "GTFS Collect" am Leben.

on:
  schedule:
    - cron: '17 3 1 * *'   # monatlich am 1., 03:17 UTC
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Zeitstempel committen
        run: |
          sed -i "s/^Letzter automatischer Keepalive: .*/Letzter automatischer Keepalive: $(date -u +%F)/" README.md
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet && echo "Keine Aenderung." && exit 0
          git commit -m "chore: keepalive $(date -u +%F)"
          git push
